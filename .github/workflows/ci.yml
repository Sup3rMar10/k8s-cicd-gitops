# REFERENCE ONLY: this workflow has never run. Replace nothing here with real secrets; it uses the
# automatic GITHUB_TOKEN. OWNER/REPO placeholders live in deploy/overlays/*/kustomization.yaml.
name: ci

on:
  push:
    branches: [main]
    # Do not re-run when the bot commits the new image tag back into deploy/.
    paths-ignore:
      - "deploy/**"
      - "argocd/**"
      - "**.md"

# Least privilege by default; the job below asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit the new image tag to the dev overlay
      packages: write      # push to GHCR
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4

      # GHCR paths must be lowercase; github.repository may not be.
      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}/app" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, load into the runner's Docker so it can be scanned BEFORE anything is pushed.
      - name: Build (not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: app
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Gate: fail the pipeline on CRITICAL vulnerabilities that have a fix available.
      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Same build again (served from cache), this time pushed. Tag is the commit SHA; no :latest.
      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

      # GitOps step: the pipeline does not touch the cluster. It records the new tag in Git,
      # and Argo CD (watching deploy/overlays/dev) rolls it out.
      # `kustomize` is, as far as I know, preinstalled on GitHub's Ubuntu runners (not verified).
      - name: Bump dev image tag in Git
        run: |
          cd deploy/overlays/dev
          kustomize edit set image "app=${IMAGE}:${GITHUB_SHA}"
          cd -
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml
          git commit -m "ci: deploy ${GITHUB_SHA::7} to dev"
          git push
