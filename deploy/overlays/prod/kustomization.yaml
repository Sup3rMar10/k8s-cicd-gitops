apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: app-prod
resources:
  - ../../base
  - hpa.yaml
# Prod is promoted by pull request: copy the tag you want from the dev overlay into newTag.
# OWNER/REPO are placeholders.
images:
  - name: app
    newName: ghcr.io/OWNER/REPO/app
    newTag: "0000000000000000000000000000000000000000"
patches:
  - target:
      kind: Deployment
      name: app
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: prod
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
